services:
  dashboard-backend:
    build: ./backend
    user: "${DASHBOARD_UID:-65532}:${DASHBOARD_GID:-65532}"
    environment:
      DASHBOARD_LISTEN: ${DASHBOARD_LISTEN:-:8080}
      MINECRAFT_HOST: ${MINECRAFT_HOST:-}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-25565}
      DASHBOARD_SERVER_NAME: ${DASHBOARD_SERVER_NAME:-Minecraft Server}
      DASHBOARD_ACCOUNTS_FILE: /run/dashboard/accounts.json
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:-}
      DASHBOARD_DATA_PATH: /var/lib/minecraft-dashboard
      DASHBOARD_ENABLE_CHAT: ${DASHBOARD_ENABLE_CHAT:-false}
      DASHBOARD_ENABLE_CONSOLE: ${DASHBOARD_ENABLE_CONSOLE:-false}
      MINECRAFT_LOG_PATH: /minecraft/logs/latest.log
      MINECRAFT_LOG_DIRECTORY: /minecraft/logs
      MINECRAFT_WORLD_PATH: /minecraft/world
      MINECRAFT_PROPERTIES_PATH: /minecraft/server.properties
      MINECRAFT_USERCACHE_PATH: /minecraft/usercache.json
      MINECRAFT_OPS_PATH: /minecraft/ops.json
      RCON_ADDRESS: ${RCON_ADDRESS:-}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      MINECRAFT_CONTAINER_NAME: ${MINECRAFT_CONTAINER_NAME:-}
      DASHBOARD_BACKUP_PATH: ${DASHBOARD_BACKUP_PATH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    # Configure only read-only source mounts. Do not mount Docker's socket here.
    volumes:
      - ${DASHBOARD_DATA_SOURCE:-dashboard-data}:/var/lib/minecraft-dashboard
      - ${DASHBOARD_ACCOUNTS_SOURCE:-/dev/null}:/run/dashboard/accounts.json:ro
      - ${MINECRAFT_LOG_DIRECTORY:-/dev/null}:/minecraft/logs:ro
      - ${MINECRAFT_WORLD_PATH:-/dev/null}:/minecraft/world:ro
      - ${MINECRAFT_PROPERTIES_PATH:-/dev/null}:/minecraft/server.properties:ro
      - ${MINECRAFT_USERCACHE_PATH:-/dev/null}:/minecraft/usercache.json:ro
      - ${MINECRAFT_OPS_PATH:-/dev/null}:/minecraft/ops.json:ro
    networks: [default, minecraft]
  dashboard-frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on: [dashboard-backend]
volumes:
  dashboard-data:
networks:
  minecraft:
    external: true
    name: ${MINECRAFT_NETWORK:-minecraft_default}
